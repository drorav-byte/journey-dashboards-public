network.on('click', p => {
  const nid=p.nodes[0]; if(!nid) return;
  const key=KMAP[String(nid)]; if(!key) return;
  if(SCR[key]) openPreview(key);
  else if(URLS[key]) window.open(URLS[key],'_blank');
});
function openPreview(key) {const b64=SCR[key]; if(!b64) return; document.getElementById('modal-title').textContent=NAMES[key]||key; document.getElementById('modal-img').src='data:image/png;base64,'+b64; document.getElementById('email-modal').style.display='flex';}
function closeModal() {document.getElementById('email-modal').style.display='none'; document.getElementById('modal-img').src='';}
document.addEventListener('keydown', e => {if(e.key==='Escape')closeModal();});
