.legend{position:absolute;bottom:12px;left:12px;background:rgba(22,27,34,.95);border:1px solid #30363d;border-radius:8px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;max-width:720px}
.li{display:flex;align-items:center;gap:5px;font-size:10px;color:#8b949e}
.ld{width:10px;height:10px;border-radius:50%;flex-shrink:0}

const edges = new vis.DataSet([{"from": 1, "to": 10, "label": "", "arrows": {"to": {"enabled": true, "scaleFactor": 0.7}}, "color": {"color": "#4d5566", "opacity": 0.85}, "font": {"size": 10, "color": "#e6edf3", "align": "middle", "background": "#0d1117", "strokeWidth": 3, "strokeColor": "#0d1117"}, "width": 1.5, "smooth": {"type": "cubicBezier", "roundness": 0.4}}, {"from": 3, "to": 5, "label": "  50%  ", "arrows": {"to": {"enabled": true, "scaleFactor": 0.7}}, "color": {"color": "#4d5566", "opacity": 0.85}, "font": {"size": 10, "color": "#e6edf3", "align": "middle", "background": "#0d1117", "strokeWidth": 3, "strokeColor": "#0d1117"}, "width": 1.5, "smooth": {"type": "cubicBezier", "roundness": 0.4}}, {"from": 3, "to": 4, "label": "  50%  ", "arrows": {"to": {"enabled": true, "scaleFactor": 0.7}}, "color": {"color": "#4d5566", "opacity": 0.85}, "font": {"size": 10, "color": "#e6edf3", "align": "middle", "background": "#0d1117", "strokeWidth": 3, "strokeColor": "#0d1117"}, "width": 1.5, "smooth": {"type": "cubicBezier", "roundness": 0.4}}, {"from": 8, "to": 3, "label": "  Stocks Cluster  ", "arrows": {"to": {"enabled": true, "scaleFactor": 0.7}}, "color": {"color": "#4d5566", "opacity": 0.85}, "font": {"size": 10, "color": "#e6edf3", "align": "middle", "background": "#0d1117", "strokeWidth": 3, "strokeColor": "#0d1117"}, "width": 1.5, "smooth": {"type": "cubicBezier", "roundness": 0.4}}, {"from": 8, "to": 9, "label": "  Crypto Cluster  ", "arrows": {"to": {"enabled": true, "scaleFactor": 0.7}}, "color": {"color": "#4d5566", "opacity": 0.85}, "font": {"size": 10, "color": "#e6edf3", "align": "middle", "background": "#0d1117", "strokeWidth": 3, "strokeColor": "#0d1117"}, "width": 1.5, "smooth": {"type": "cubicBezier", "roundness": 0.4}}, {"from": 8, "to": 7, "label": "  Beginners  ", "arrows": {"to": {"enabled": true, "scaleFactor": 0.7}}, "color": {"color": "#4d5566", "opacity": 0.85}, "font": {"size": 10, "color": "#e6edf3", "align": "middle", "background": "#0d1117", "strokeWidth": 3, "strokeColor": "#0d1117"}, "width": 1.5, "smooth": {"type": "cubicBezier", "roundness": 0.4}}, {"from": 9, "to": 2, "label": "  50%  ", "arrows": {"to": {"enabled": true, "scaleFactor": 0.7}}, "color": {"color": "#4d5566", "opacity": 0.85}, "font": {"size": 10, "color": "#e6edf3", "align": "middle", "background": "#0d1117", "strokeWidth": 3, "strokeColor": "#0d1117"}, "width": 1.5, "smooth": {"type": "cubicBezier", "roundness": 0.4}}, {"from": 9, "to": 6, "label": "  50%  ", "arrows": {"to": {"enabled": true, "scaleFactor": 0.7}}, "color": {"color": "#4d5566", "opacity": 0.85}, "font": {"size": 10, "color": "#e6edf3", "align": "middle", "background": "#0d1117", "strokeWidth": 3, "strokeColor": "#0d1117"}, "width": 1.5, "smooth": {"type": "cubicBezier", "roundness": 0.4}}, {"from": 10, "to": 8, "label": "  Test Group  ", "arrows": {"to": {"enabled": true, "scaleFactor": 0.7}}, "color": {"color": "#4d5566", "opacity": 0.85}, "font": {"size": 10, "color": "#e6edf3", "align": "middle", "background": "#0d1117", "strokeWidth": 3, "strokeColor": "#0d1117"}, "width": 1.5, "smooth": {"type": "cubicBezier", "roundness": 0.4}}]);

  nodes:{margin:{top:10,bottom:10,left:14,right:14},widthConstraint:{minimum:100,maximum:180}},
  edges:{width:1.5,selectionWidth:2.5,smooth:{type:'cubicBezier',roundness:0.4}}
});
network.on('click', p => {
  const nid=p.nodes[0]; if(!nid) return;
  const key=KMAP[String(nid)]; if(!key) return;
  if(SCR[key]) openPreview(key);
  else if(URLS[key]) window.open(URLS[key],'_blank');
});
function openPreview(key) {const b64=SCR[key]; if(!b64) return; document.getElementById('modal-title').textContent=NAMES[key]||key; document.getElementById('modal-img').src='data:image/png;base64,'+b64; document.getElementById('email-modal').style.display='flex';}
function closeModal() {document.getElementById('email-modal').style.display='none'; document.getElementById('modal-img').src='';}
document.addEventListener('keydown', e => {if(e.key==='Escape')closeModal();});
let dir='UD';function toggleDirection(){dir=dir==='UD'?'LR':'UD';network.setOptions({layout:{hierarchical:{direction:dir}}});setTimeout(()=>network.fit(),100);}
</script></body></html>
